name: engineering-hub-web-ci

# Builds, lints, and tests the AICC Engineering Hub web app on every push and PR.
# Scoped to engineering-hub/web (the only implemented application). No deploy,
# no secrets, no AWS calls — just reproducible build + quality gates.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering-hub/web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: engineering-hub/web/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm run test
